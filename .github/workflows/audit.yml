name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  # Advisories are published against code that has not changed, so a clean
  # tree has to be re-checked on a schedule rather than only on push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      # `Cargo.lock` is not committed (this is a library), so audit the graph
      # a consumer would resolve today.
      - run: cargo generate-lockfile
      - run: cargo audit --deny warnings
