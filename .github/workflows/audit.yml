name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  # Advisories are published against code that has not changed, so a clean
  # tree has to be re-checked on a schedule rather than only on push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      # `Cargo.lock` is not committed (this is a library), so audit the graphs
      # consumers resolve today: first the newest versions, which is what most
      # get, then (below) the MSRV-compatible ones.
      - run: cargo generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
      - run: cargo audit --deny warnings
      # Advisories again under cargo-deny's policy (unmaintained crates fail
      # too), plus banned crates (native TLS) and non-crates.io sources.
      - run: cargo deny check advisories bans sources
      # Consumers on an older toolchain resolve older versions; audit the
      # graph the MSRV-aware resolver picks for 1.94.1 as well.
      - run: cargo generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories bans sources
      # The fuzz harness is its own workspace with its own (also uncommitted)
      # lockfile; its dependencies run in CI too.
      - run: cargo generate-lockfile --manifest-path fuzz/Cargo.toml
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
