# Dependabot configuration for this crate's repository.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release has a week to be yanked or flagged before it is proposed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(rust)"
    labels:
      - "dependencies"
    # Only patch releases are grouped; minor bumps are reviewed one by one.
    groups:
      rust-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # The fuzz harness is its own workspace, so it needs its own entry.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release has a week to be yanked or flagged before it is proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(fuzz)"
    labels:
      - "dependencies"

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release has a week to be yanked or flagged before it is proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
