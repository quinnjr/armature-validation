[package]
name = "armature-validation"
version = "0.7.0"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-validation"
homepage = "https://quinnjr.github.io/armature"
description = "Request validation for Armature handlers"
keywords = ["validation", "validator", "input", "sanitize"]
categories = ["web-programming"]
# Publish the library and its tests, not CI, fuzzing or local git-hook config.
include = ["src/**", "tests/**", "benches/**", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
# Without default features: core's `h1-backend` default selects the server
# implementation, and an application that chose the other one must not have
# it switched back just by depending on this crate.
armature-core = { version = "0.12", default-features = false }
armature-proc-macro = { version = "0.6" }
serde = "1.0"
serde_json = "1.0"
regex = "1.13"
# Parses (without compiling) the bare pattern `Matches::full` anchors. The
# same major `regex` itself uses.
regex-syntax = "0.8"
# `IsUrl` parses rather than pattern-matches: a regex that "looks like a URL"
# both rejects valid URLs (`https://a`) and accepts invalid ones (`https://!!`).
url = "2.5"
async-trait = "0.1"
# `validate_parallel` needs only `JoinSet` and `Handle::try_current`.
tokio = { version = "1.53", features = ["rt"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["rt", "macros"] }
criterion = { version = "0.8", features = ["html_reports"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
trybuild = "1.0"

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "validation"
harness = false
